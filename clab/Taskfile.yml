version: '3'

# kind + containerlab on the underlay -- an alternative to vm/, see
# clab/DESIGN.md. Standalone from the root Taskfile.yml and from
# vm/Taskfile.yml, same reasoning as the latter: run from here (`cd clab &&
# task <name>`) or `task --dir clab <name>` from the repo root. Underlay
# tasks (BIRD, dnsmasq, FIB) are in ../Taskfile.yml, untouched by anything
# here.
#
# coil/cilium install machinery is imported from ../../mooring/e2e_v2
# largely as-is (coil/Taskfile.yaml, cilium/Taskfile.yaml) -- only the
# kind-cluster name and physical-NIC device name needed adapting for xdplab.
includes:
  coil:
    taskfile: ./coil/Taskfile.yaml
    dir: ./coil
  cilium:
    taskfile: ./cilium/Taskfile.yaml
    dir: ./cilium

vars:
  HOSTNAME:
    sh: hostname

tasks:
  build-images:
    desc: Build the mover and BIRD sidecar images
    cmds:
      - docker build -t xdplab-mover:local mover/
      - docker build -t xdplab-bird:local bird/

  start:
    desc: Deploy the kind+containerlab topology (physical NICs moved into the kind nodes, BIRD peering with r5500) and export kubeconfig (run this ON r9600)
    preconditions:
      - sh: '[ "{{.HOSTNAME}}" = "r9600" ]'
        msg: 'must run on r9600 (current host: {{.HOSTNAME}})'
    cmds:
      - task: build-images
      - sudo containerlab deploy -t cluster.clab.yaml
      - kind export kubeconfig --name xdplab

  stop:
    desc: Tear down the kind+containerlab topology -- moves both physical NICs back to the host netns first (clab/DESIGN.md "Giving nodes real NICs"), then destroys (run this ON r9600)
    preconditions:
      - sh: '[ "{{.HOSTNAME}}" = "r9600" ]'
        msg: 'must run on r9600 (current host: {{.HOSTNAME}})'
    cmds:
      - task: restore-nics
      - sudo containerlab destroy -t cluster.clab.yaml --cleanup

  restore-nics:
    desc: Move both physical NICs back to the host netns without tearing anything else down (best-effort -- e.g. after a node restart, clab/DESIGN.md "Operational notes")
    cmds:
      - cmd: sudo sh mover/restore.sh xdplab-control-plane eth1 enp4s0f0
        ignore_error: true
      - cmd: sudo sh mover/restore.sh xdplab-worker eth1 enp4s0f1
        ignore_error: true
