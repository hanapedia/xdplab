version: '3'

# kind + containerlab on the underlay -- an alternative to vm/, see
# clab/DESIGN.md. Standalone from the root Taskfile.yml and from
# vm/Taskfile.yml, same reasoning as the latter: run from here (`cd clab &&
# task <name>`) or `task --dir clab <name>` from the repo root. Underlay
# tasks (BIRD, dnsmasq, FIB) are in ../Taskfile.yml, untouched by anything
# here.
#
# coil/cilium/mooring install machinery is imported from ../../mooring/e2e_v2
# largely as-is (coil/Taskfile.yaml, cilium/Taskfile.yaml, mooring/Taskfile.yaml)
# -- only the kind-cluster name and physical-NIC device name needed adapting
# for xdplab. Unlike coil/cilium, mooring's own images aren't built here --
# see mooring/Taskfile.yaml.
includes:
  coil:
    taskfile: ./coil/Taskfile.yaml
    dir: ./coil
  cilium:
    taskfile: ./cilium/Taskfile.yaml
    dir: ./cilium
  mooring:
    taskfile: ./mooring/Taskfile.yaml
    dir: ./mooring

vars:
  HOSTNAME:
    sh: hostname
  R5500_HOST:
    sh: echo "${R5500_HOST:-r5500}"
  R5500_DEPLOY_DIR:
    sh: echo "${R5500_DEPLOY_DIR:-/opt/xdplab}"

tasks:
  # --- r5500 deploy plumbing (domestic0/domestic1 only -- bird/dnsmasq are
  # the underlay's, synced by ../Taskfile.yml's own r5500:sync; regmirror is
  # vm/'s, synced by vm/Taskfile.yml's own r5500:sync) -------------------
  r5500:sync:
    desc: Rsync domestic/ to {{.R5500_HOST}}:{{.R5500_DEPLOY_DIR}}/clab/domestic
    run: once
    cmds:
      - ssh {{.R5500_HOST}} 'sudo mkdir -p {{.R5500_DEPLOY_DIR}}/clab/domestic && sudo chown -R "$(id -un):$(id -gn)" {{.R5500_DEPLOY_DIR}}/clab'
      - rsync -az --delete -e ssh domestic/ {{.R5500_HOST}}:{{.R5500_DEPLOY_DIR}}/clab/domestic/

  # --- domestic0/domestic1 test targets (r5500 only) -----------------------
  domestic:setup:
    desc: Sync + set up domestic0/domestic1 test targets on r5500, over SSH from here
    deps: [r5500:sync]
    cmds:
      - ssh {{.R5500_HOST}} 'sudo {{.R5500_DEPLOY_DIR}}/clab/domestic/domestic-ctl.sh setup'

  domestic:destroy:
    desc: Tear down domestic0/domestic1 on r5500, over SSH from here
    cmds:
      - ssh {{.R5500_HOST}} 'sudo {{.R5500_DEPLOY_DIR}}/clab/domestic/domestic-ctl.sh destroy'

  domestic:status:
    desc: Show domestic0/domestic1 status on r5500, over SSH from here
    cmds:
      - ssh {{.R5500_HOST}} 'sudo {{.R5500_DEPLOY_DIR}}/clab/domestic/domestic-ctl.sh status'

  build-images:
    desc: Build the mover and BIRD sidecar images
    cmds:
      - docker build -t xdplab-mover:local mover/
      - docker build -t xdplab-bird:local bird/

  start:
    desc: Deploy the kind+containerlab topology (physical NICs moved into the kind nodes, BIRD peering with r5500) and export kubeconfig (run this ON r9600)
    preconditions:
      - sh: '[ "{{.HOSTNAME}}" = "r9600" ]'
        msg: 'must run on r9600 (current host: {{.HOSTNAME}})'
    cmds:
      - task: build-images
      - sudo containerlab deploy -t cluster.clab.yaml
      - kind export kubeconfig --name xdplab

  stop:
    desc: Tear down the kind+containerlab topology -- moves both physical NICs back to the host netns first (clab/DESIGN.md "Giving nodes real NICs"), then destroys (run this ON r9600)
    preconditions:
      - sh: '[ "{{.HOSTNAME}}" = "r9600" ]'
        msg: 'must run on r9600 (current host: {{.HOSTNAME}})'
    cmds:
      - task: restore-nics
      - sudo containerlab destroy -t cluster.clab.yaml --cleanup

  restore-nics:
    desc: Move both physical NICs back to the host netns without tearing anything else down (best-effort -- e.g. after a node restart, clab/DESIGN.md "Operational notes")
    cmds:
      - cmd: sudo sh mover/restore.sh xdplab-control-plane node0 enp4s0f0
        ignore_error: true
      - cmd: sudo sh mover/restore.sh xdplab-worker node0 enp4s0f1
        ignore_error: true

  # --- sample resources (mooring/e2e_v2's apply-sample-resources) ----------
  sample:apply:
    desc: Load the debug image and apply the domestic1-client sample pods (mooring/sample/) used by the perf tasks below
    cmds:
      - kind load docker-image ghcr.io/cybozu/ubuntu-debug:24.04 --name xdplab
      - kubectl apply -k mooring/sample/
      - kubectl wait pod -l app=domestic1-client -n default --for=condition=Ready --timeout=300s

  # --- quick connectivity check ---------------------------------------------
  connectivity:test:
    desc: From each sample pod, ping the other sample pod (cross-node) and domestic0/domestic1 (via mooring SNAT)
    silent: true
    cmds:
      - |
        set -u
        WORKER_POD=domestic1-client-xdplab-worker
        CP_POD=domestic1-client-xdplab-control-plane
        WORKER_IP=$(kubectl get pod "$WORKER_POD" -o jsonpath='{.status.podIP}')
        CP_IP=$(kubectl get pod "$CP_POD" -o jsonpath='{.status.podIP}')

        rc=0
        check() {
          local from="$1" target="$2" label="$3"
          if kubectl exec "$from" -- ping -c2 -W1 "$target" >/dev/null 2>&1; then
            echo "OK   $from -> $label ($target)"
          else
            echo "FAIL $from -> $label ($target)"
            rc=1
          fi
        }

        check "$WORKER_POD" "$CP_IP" "$CP_POD (cross-node)"
        check "$WORKER_POD" 192.168.0.100 "domestic0"
        check "$WORKER_POD" 192.168.10.100 "domestic1"
        check "$CP_POD" "$WORKER_IP" "$WORKER_POD (cross-node)"
        check "$CP_POD" 192.168.0.100 "domestic0"
        check "$CP_POD" 192.168.10.100 "domestic1"

        exit $rc

  # --- perf tests (mooring/e2e_v2's perf-* tasks) ---------------------------
  # domestic0 (iperf3 server) is a plain docker container on r5500, not local
  # to this host -- unlike the reference, where domestic0 is a containerlab
  # node on the same machine as the kind cluster -- so these go over SSH.
  perf:server-start:
    desc: Start the iperf3 server on domestic0 (192.168.0.100, r5500)
    cmds:
      - ssh {{.R5500_HOST}} 'docker exec xdplab-domestic0 iperf3 -s -D'

  perf:server-stop:
    desc: Stop the iperf3 server on domestic0
    cmds:
      - ssh {{.R5500_HOST}} 'docker exec xdplab-domestic0 pkill iperf3 || true'

  perf:mooring-fast:
    desc: "Mooring fast path perf: client and NAT gateway on the same node (worker, the mooring.hanapeida.link/advertise node)"
    vars:
      SERVER: 192.168.0.100
      POD: domestic1-client-xdplab-worker
    cmds:
      - 'echo "=== Mooring Fast Path: Big Packets ==="'
      - kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30
      - 'echo "=== Mooring Fast Path: Small Packets (128-byte blocks) ==="'
      - kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30 -l 128

  perf:mooring-slow:
    desc: "Mooring slow path perf: client on control-plane, NAT gateway on worker"
    vars:
      SERVER: 192.168.0.100
      POD: domestic1-client-xdplab-control-plane
    cmds:
      - 'echo "=== Mooring Slow Path: Big Packets ==="'
      - kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30
      - 'echo "=== Mooring Slow Path: Small Packets (128-byte blocks) ==="'
      - kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30 -l 128

  perf:mooring:
    desc: Run mooring performance tests (fast and slow path, big and small packets)
    cmds:
      - task: perf:server-start
      - task: perf:mooring-fast
      - task: perf:mooring-slow
      - task: perf:server-stop
