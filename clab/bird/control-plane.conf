# BIRD config — control-plane (kind node, clab/DESIGN.md)
#
# Runs inside the same netns as the kind node container (network-mode:
# container:xdplab-control-plane), peering with r5500 directly over the
# physical link that was moved in as eth1 -- no separate management path.
#
# Coil and Cilium integration follows mooring/e2e_v2's bird configs
# (network/bird/*.conf), minus its `gateway recursive` + bgp_next_hop
# import-filter trick on the outward session -- that exists to resolve
# next-hops through its shared-L2/single-AS ToR fabric; our r5500 session is
# genuine eBGP over a directly-connected /30, so a plain eBGP next-hop is
# already correct with no extra resolution needed.

router id 10.10.0.2;

log stderr all;

protocol device {
}

# Coil (github.com/cybozu-go/coil) doesn't speak BGP -- coild programs pod
# routes into kernel table 119 itself, and its own ip rule makes that table
# authoritative for pod traffic. This just re-exposes those routes to BIRD's
# main table so the r5500 session below can re-advertise them -- it must NOT
# also write them back to the kernel (see the main kernel protocol's export
# filter), since coild already owns table 119.
ipv4 table coiltab;

protocol kernel 'coil' {
  kernel table 119;
  learn;
  scan time 1;
  ipv4 {
    table coiltab;
    import all;
    export none;
  };
}

protocol pipe {
  table master4;
  peer table coiltab;
  import all;
  export none;
}

# Cilium runs its own BGP speaker and peers here over loopback (clab/DESIGN.md
# "CNI") instead of talking to r5500 directly -- BIRD re-advertises whatever
# it learns. Community-tagged so the main kernel protocol's export (below)
# can recognize and exclude it: same reasoning as Coil above, Cilium's own
# native routing owns kernel-level installation, BIRD shouldn't duplicate it.
protocol bgp cilium {
  local as 64517;
  neighbor 127.0.0.1 as 64516;

  multihop;
  passive;
  ipv4 {
    import filter {
      bgp_community.add((64516, 64517));
      accept;
    };
    export none;
  };
}

# Only this protocol's *export* (i.e. what gets installed into the local
# kernel routing table) excludes Coil/Cilium-sourced routes -- the r5500
# session below still exports all of them, unfiltered, same as
# mooring/e2e_v2's `tor` session: the whole point is advertising pod routes
# out to the router, just without also redundantly re-installing them
# locally, since coild/Cilium already do that themselves.
protocol kernel {
  ipv4 {
    import none;
    export filter {
      if proto = "coil" then reject;
      if (64516, 64517) ~ bgp_community then reject;
      accept;
    };
  };
}

protocol bgp r5500 {
  local as 64514;
  neighbor 10.10.0.1 as 64513;

  ipv4 {
    import all;
    export all;
  };
}
