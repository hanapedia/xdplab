# Pull-through registry mirrors served to the Talos VMs, which have no route
# to the public internet (DESIGN.md §1.2). One line per upstream registry:
#   <name> <upstream-url> <port>
# name becomes the systemd instance (xdplab-regmirror@<name>.service) and the
# cache's storage subdir; port is what it listens on (host networking, so
# reachable from both XDP links at once). Wire new entries into Talos configs
# via .machine.registries.mirrors (talos/terraform/machine_configs.tf).
factory https://factory.talos.dev 5000
k8s https://registry.k8s.io 5001
ghcr https://ghcr.io 5002
