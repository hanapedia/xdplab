# BIRD config — r9600 (hypervisor/workstation)
#
# Peers with r5500 over the shared LAN (standard BGP, port 179) to learn
# routes to the two XDP-link /30s (10.10.0.0/30, 10.10.1.0/30), so the VMs
# (control-plane, worker) are reachable from r9600 (talosctl) without a
# separate management network. r9600 has no host-visible interface on the
# XDP links themselves (both ports are VFIO-passed to VMs).

router id 192.168.1.100;

log stderr all;

protocol device {
}

# Writes BGP-learned routes into a dedicated Linux kernel table (100,
# "xdplab") instead of the default/main table, so they stay separated
# from r9600's normal LAN routing. `kernel table` selects the Linux
# table; on its own this table is unreachable — bird/scripts/fib-ctl.sh
# adds the ip rules that route lookups for the two /30s into it.
protocol kernel {
  kernel table 100;
  ipv4 {
    import none;
    export all;
  };
}

protocol bgp r5500 {
  local as 64512;
  source address 192.168.1.100;
  neighbor 192.168.1.200 as 64513;

  ipv4 {
    import all;
    export none;
  };
}
