# BIRD config — r5500 (bare-metal router)
#
# Peers with r9600 over the shared LAN (standard BGP, port 179) and
# exports the two directly-connected XDP-link /30s so r9600's kernel FIB
# gets routes to the VMs (control-plane, worker). `protocol direct` does
# not redistribute into BGP by default — the export filter below is
# required.
#
# r5500 does NOT need this BGP session to forward traffic between the two
# VMs; that's plain kernel ip_forward between the two directly-connected
# /30s, independent of this session's state.

router id 192.168.1.200;

log stderr all;

protocol device {
}

protocol direct xdp_links {
  interface "enp1s0f0", "enp1s0f1";
  ipv4 {
    import all;
  };
}

protocol kernel {
  ipv4 {
    import none;
    export filter {
      # xdp_links (protocol direct) only mirrors interface routes the
      # kernel already installs natively -- exporting them back would just
      # duplicate each /30 as a second, redundant `proto bird` route
      # alongside the kernel's own `proto kernel` one. RTS_DEVICE is any
      # such directly-connected-interface route, not just this protocol by
      # name (mooring/e2e_v2's own kernel export filter uses the same check).
      if source = RTS_DEVICE then reject;
      accept;
    };
  };
}

protocol bgp r9600 {
  local as 64513;
  source address 192.168.1.200;
  neighbor 192.168.1.100 as 64512;

  ipv4 {
    import none;
    export filter {
      if net ~ [ 10.10.0.0/30, 10.10.1.0/30 ] then accept;
      reject;
    };
  };
}


# Peers directly with each kind node's own BIRD instance over its XDP link
# (clab/DESIGN.md "BGP in each node's netns") -- eBGP, direct-connected like
# the r9600 session above, no multihop needed.
protocol bgp 'control-plane' {
  local as 64513;
  neighbor 10.10.0.2 as 64514;
  direct;
  passive;

  ipv4 {
    import all;
    # The other node's /30 is redundant to reflect here: its next hop
    # would be r5500 either way (this node's default route already goes
    # via r5500), and r5500 forwards between the two /30s on its own
    # regardless of this session's state. Excluding it (RTS_DEVICE, same
    # check as this file's own kernel export) avoids each kind node
    # double-installing its *own* /30 when it comes back reflected.
    export filter {
      if source = RTS_DEVICE then reject;
      accept;
    };
  };
}

protocol bgp 'k8s-worker' {   # not `worker` -- collides with a BIRD 3.x reserved symbol even quoted (mooring/e2e_v2 hits the same thing)
  local as 64513;
  neighbor 10.10.1.2 as 64515;
  direct;
  passive;

  ipv4 {
    import all;
    export filter {
      if source = RTS_DEVICE then reject;
      accept;
    };
  };
}
