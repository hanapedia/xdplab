# BIRD config — r5500 (bare-metal router)
#
# Peers with r9600 over the shared LAN (standard BGP, port 179) and
# exports the two directly-connected XDP-link /30s so r9600's kernel FIB
# gets routes to the VMs (control-plane, worker). `protocol direct` does
# not redistribute into BGP by default — the export filter below is
# required.
#
# r5500 does NOT need this BGP session to forward traffic between the two
# VMs; that's plain kernel ip_forward between the two directly-connected
# /30s, independent of this session's state.

router id 192.168.1.200;

log stderr all;

protocol device {
}

protocol direct xdp_links {
  interface "enp1s0f0", "enp1s0f1";
  ipv4 {
    import all;
  };
}

protocol kernel {
  ipv4 {
    import none;
    export all;
  };
}

protocol bgp r9600 {
  local as 64513;
  source address 192.168.1.200;
  neighbor 192.168.1.100 as 64512;

  ipv4 {
    import none;
    export filter {
      if net ~ [ 10.10.0.0/30, 10.10.1.0/30 ] then accept;
      reject;
    };
  };
}


# Peers directly with each kind node's own BIRD instance over its XDP link
# (clab/DESIGN.md "BGP in each node's netns") -- eBGP, direct-connected like
# the r9600 session above, no multihop needed.
protocol bgp 'control-plane' {
  local as 64513;
  neighbor 10.10.0.2 as 64514;

  ipv4 {
    import all;
    export filter {
      if net ~ [ 10.10.0.0/30, 10.10.1.0/30 ] then accept;
      reject;
    };
  };
}

protocol bgp 'k8s-worker' {   # not `worker` -- collides with a BIRD 3.x reserved symbol even quoted (mooring/e2e_v2 hits the same thing)
  local as 64513;
  neighbor 10.10.1.2 as 64515;

  ipv4 {
    import all;
    export filter {
      if net ~ [ 10.10.0.0/30, 10.10.1.0/30 ] then accept;
      reject;
    };
  };
}
