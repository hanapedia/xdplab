# dnsmasq: DHCP-only, per-MAC static reservations for the two Talos VMs on
# the XDP point-to-point links (DESIGN.md §1.2/§3). No DNS role on this host
# (port=0) — bound explicitly to just these two interfaces so it never
# touches the LAN (enp7s0) or loopback.

port=0
bind-interfaces
interface=enp1s0f0
interface=enp1s0f1
except-interface=lo

dhcp-authoritative
dhcp-leasefile=/run/dnsmasq/dnsmasq.leases
log-dhcp

# One dhcp-range per /30, "static" mode: DHCP is enabled on the subnet but
# only the dhcp-host entries below ever get a lease — no dynamic pool.
dhcp-range=10.10.0.0,static,255.255.255.252,1h
dhcp-range=10.10.1.0,static,255.255.255.252,1h

# control-plane -> Link 0 (enp1s0f0 side), worker -> Link 1 (enp1s0f1 side).
# MACs are the VMs' *physical* NICs (SPEC.md) — true VFIO passthrough.
dhcp-host=a0:36:9f:f9:b1:b4,10.10.0.2
dhcp-host=a0:36:9f:f9:b1:b5,10.10.1.2
